# 1. UPSTREAM CONNECTION POOLING (Localized Single-Container Loop Optimization)
upstream php_backend {
    server 127.0.0.1:9000;
    # Keeps up to 32 idle connections open to PHP-FPM to eliminate container socket overhead
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    
    # Disable Nginx version exposure in headers and default error pages
    server_tokens off;
    
    # 2. CLIENT-SIDE KEEP-ALIVE TUNING
    keepalive_timeout 65s;
    keepalive_requests 1000;
    
    root /var/www/html/public;
    index index.php index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Explicitly define the custom error page
    error_page 404 /404.php;

    location / {
        try_files $uri $uri/ =404;
    }

    # Allow the custom 404 page to execute as PHP
    location = /404.php {
        fastcgi_pass php_backend;
        # Instructs Nginx to keep the upstream FastCGI connection alive
        fastcgi_keep_conn on;
        
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Pass the natively corrected real client IP address
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        
        internal; 
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Using the defined upstream pool instead of direct container name
        fastcgi_pass php_backend; 
        # Instructs Nginx to keep the upstream FastCGI connection alive
        fastcgi_keep_conn on;

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Pass the natively corrected real client IP address down to FastCGI
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }

    location ~ /\.(?!well-known).* {
        return 404;
    }
}
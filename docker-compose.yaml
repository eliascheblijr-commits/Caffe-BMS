version: '3.8'

services:
  # 1. PHP APPLICATION (The logic)
  app:
    build: 
      context: .
      dockerfile: ./deployment/docker/php/Dockerfile
    container_name: caffe_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # STRICT LEAST-PRIVILEGE MOUNTS
      - ./public:/var/www/html/public
      - ./private:/var/www/html/private
      - ./.env:/var/www/html/.env
      - ./deployment/docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    depends_on:
      - db
    networks:
      - caffe_network

  # 2. NGINX (The entry point)
  web:
    image: nginx:alpine
    container_name: caffe_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # STRICT LEAST-PRIVILEGE MOUNTS
      - ./public:/var/www/html/public
      - ./deployment/docker/nginx/compose.conf:/etc/nginx/conf.d/default.conf
      - ./deployment/docker/nginx/init-realip.sh:/docker-entrypoint.d/init-realip.sh
    depends_on:
      - app
    networks:
      - caffe_network

  # 3. DATABASE (MySQL 8 — required for utf8mb4_0900_ai_ci collation used in the schema)
  db:
    image: mysql:8.0
    container_name: caffe_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - caffe_db_data:/var/lib/mysql
      # Auto-imported by the MySQL entrypoint only on first boot (empty data dir)
      - ./deployment/caffe.sql:/docker-entrypoint-initdb.d/01-caffe.sql
    networks:
      - caffe_network

volumes:
  caffe_db_data:

networks:
  caffe_network:
    driver: bridge